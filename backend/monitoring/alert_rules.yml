#===== ./backend/monitoring/alert_rules.yml =====

groups:
  - name: it_analytics_alerts
    rules:
      - alert: HighRiskProjectDetected
        expr: risk_score > 80
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High risk project detected"
          description: "Project {{ $labels.project_id }} has risk score {{ $value }}"
          
      - alert: AnomalyDetectionSpike
        expr: increase(anomalies_detected_total[1h]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Anomaly detection spike"
          description: "{{ $value }} anomalies detected in the last hour"
          
      - alert: ModelPredictionFailure
        expr: increase(model_prediction_errors_total[5m]) > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ML model prediction failures"
          description: "Multiple model prediction failures detected"
===== ./backend/monitoring/prometheus.yml =====

# Prometheus configuration for monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  - job_name: 'it-analytics-backend'
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: '/metrics'
    scrape_interval: 30s
    
  - job_name: 'postgres'
    static_configs:
      - targets: ['localhost:9187']
    scrape_interval: 30s